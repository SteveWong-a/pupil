<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pupil" />
    <title>Pupil — The Mac security sentinel for public spaces</title>
    <meta
      name="description"
      content="A notch-native security sentinel for Mac, with four core tripwires: gaze blur, power unplug, lid slam and display lock, built for libraries and cafes."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/pupil-icon.png" />
    <link rel="icon" type="image/png" href="./assets/pupil-icon.png" />
    <style>html{background:#000}.boot-veil{background:radial-gradient(circle at 50% 46%,#9cc2ff12 0%,#0000 48%),#000;place-items:center;display:grid;position:fixed;inset:0}.boot-iris{border:1px solid #f3f2f024;border-radius:50%;place-items:center;width:78px;height:78px;display:grid;position:relative}.boot-sweep{background:conic-gradient(#0000 0deg 210deg,#9cc2ff47 285deg,#9cc2ff 356deg,#0000 360deg);border-radius:50%;animation:1.65s linear infinite boot-spin;position:absolute;inset:-1px;-webkit-mask-image:radial-gradient(farthest-side,#0000 calc(100% - 2px),#000 calc(100% - 1.5px));mask-image:radial-gradient(farthest-side,#0000 calc(100% - 2px),#000 calc(100% - 1.5px))}@keyframes boot-spin{to{rotate:1turn}}@media (prefers-reduced-motion:reduce){.boot-sweep{animation-duration:8s}}</style>
    <script>
      /* Preserve 100% QR pairing & iOS Home Screen PWA compatibility */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var v = params.get("v");
          var c = params.get("c");
          var companionFlag = params.get("companion") === "1";
          var isStandalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

          if (v) localStorage.setItem("pupil.vapidPublicKey", v);
          if (c) localStorage.setItem("pupil.pairingChannel", c);

          if ((v || c) && "caches" in window) {
            caches
              .open("pupil-pairing-v1")
              .then(function (cache) {
                return cache.put(
                  new Request("./pairing-config.json"),
                  new Response(
                    JSON.stringify({
                      v: v || localStorage.getItem("pupil.vapidPublicKey") || "",
                      c: c || localStorage.getItem("pupil.pairingChannel") || "",
                    }),
                    { headers: { "Content-Type": "application/json" } }
                  )
                );
              })
              .catch(function () {});
          }

          if (v || c || companionFlag || isStandalone) {
            window.location.replace("./companion.html" + window.location.search);
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Newsreader:opsz,wght@6..72,700&display=swap"
    />
    <script type="module" crossorigin src="./assets/index-BCJx-Bt3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C5tEtVEE.css">
  </head>
  <body class="is-locked">
    <div id="root">
      <div class="boot-veil" aria-label="Loading Pupil">
        <div class="boot-iris"><span class="boot-sweep"></span></div>
      </div>
    </div>
  </body>
</html>
