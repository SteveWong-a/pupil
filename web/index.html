<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pupil" />
    <title>Pupil — The Mac security sentinel for public spaces</title>
    <meta
      name="description"
      content="A notch-native security sentinel for Mac, with four core tripwires: gaze blur, power unplug, lid slam and display lock, built for libraries and cafes."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/pupil-icon.png" />
    <link rel="icon" type="image/png" href="./assets/pupil-icon.png" />
    <style>
      html { background: #000; }
      .boot-veil {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 62% 38%, rgba(156, 194, 255, 0.085) 0%, rgba(156, 194, 255, 0.02) 26%, rgba(0, 0, 0, 0) 56%),
          #000;
      }
      .boot-logo {
        width: clamp(148px, 18vw, 196px);
        height: clamp(148px, 18vw, 196px);
        display: block;
      }
    </style>
    <script>
      /* Preserve 100% QR pairing & iOS Home Screen PWA compatibility */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var v = params.get("v");
          var c = params.get("c");
          var companionFlag = params.get("companion") === "1";
          var isStandalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

          if (v) localStorage.setItem("pupil.vapidPublicKey", v);
          if (c) localStorage.setItem("pupil.pairingChannel", c);

          if ((v || c) && "caches" in window) {
            caches
              .open("pupil-pairing-v1")
              .then(function (cache) {
                return cache.put(
                  new Request("./pairing-config.json"),
                  new Response(
                    JSON.stringify({
                      v: v || localStorage.getItem("pupil.vapidPublicKey") || "",
                      c: c || localStorage.getItem("pupil.pairingChannel") || "",
                    }),
                    { headers: { "Content-Type": "application/json" } }
                  )
                );
              })
              .catch(function () {});
          }

          if (v || c || companionFlag || isStandalone) {
            window.location.replace("./companion.html" + window.location.search);
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Newsreader:opsz,wght@6..72,700&display=swap"
    />
  </head>
  <body class="is-locked">
    <div id="root">
      <div class="boot-veil" aria-label="Loading Pupil">
        <svg class="boot-logo" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="b-blk" x1="178" y1="14" x2="22" y2="186" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3c4960" />
              <stop offset="45%" stop-color="#161920" />
              <stop offset="100%" stop-color="#0d0f13" />
            </linearGradient>
            <linearGradient id="b-gry" x1="150" y1="46" x2="50" y2="154" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c5d6f0" />
              <stop offset="52%" stop-color="#868f9c" />
              <stop offset="100%" stop-color="#636a75" />
            </linearGradient>
            <linearGradient id="b-wht" x1="134" y1="64" x2="66" y2="136" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="58%" stop-color="#d7e1f0" />
              <stop offset="100%" stop-color="#bac4d4" />
            </linearGradient>
          </defs>
          <g transform="translate(100 100)">
            <path d="M 0 0 L 77.585 56.369 A 95.9 95.9 0 1 1 95.9 0 Z" fill="url(#b-blk)" />
          </g>
          <g transform="translate(100 100) rotate(120)">
            <path d="M 0 0 L 58.014 18.85 A 61 61 0 1 1 58.014 -18.85 Z" fill="url(#b-gry)" />
          </g>
          <g transform="translate(100 100) rotate(240)">
            <path d="M 0 0 L 38.604 -6.807 A 39.2 39.2 0 1 1 27.23 -28.198 Z" fill="url(#b-wht)" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
